[package]
name = "aikatsu_mobile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "flutter_rust_bridge glue between the Android app and aikatsu-core"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
aikatsu-core = { path = "../../core" }
anyhow = "1"
flutter_rust_bridge = "=2.13.0"
serde_json = "1"
tracing = "0.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
