[package]
name = "aikatsu"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Desktop anime streaming client (Indonesian sub sources), Qt Quick + Rust"

[dependencies]
aikatsu-core = { path = "../core", features = ["desktop"] }
anyhow = "1"
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
dirs = "6"
serde_json = "1"
tracing = "0.1"

[build-dependencies]
cxx-qt-build = "0.10"
pkg-config = "0.3"
