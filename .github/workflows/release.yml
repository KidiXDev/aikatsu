name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # test the builds without tagging; only tags publish a release

permissions:
  contents: read

env:
  # Pinned to the Qt the app is developed and tested on; both packages ship this
  # exact Qt, so users never run it against an older one.
  QT_VERSION: "6.11.2"
  # Qt 6.11 moved its Windows downloads to a new folder layout that aqtinstall
  # only understands since #1000, which isn't on PyPI yet (3.3.0 is the latest).
  # Drop this, and the aqtsource lines, once aqtinstall 3.4 is released.
  AQT_SOURCE: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
  # The Flutter the Android app is developed and tested on.
  FLUTTER_VERSION: "3.47.1"
  # Default sync server compiled into the apps (core/src/sync.rs). Without it, users must enter one.
  AIKATSU_SYNC_SERVER: ${{ secrets.AIKATSU_SYNC_SERVER }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libgl1-mesa-dev libegl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtimageformats
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Icon font
        run: |
          pip install fonttools brotli
          python desktop/assets/fonts/subset_icons.py

      - name: Build
        run: cargo build --release --locked
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake

      - name: AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
          QML_SOURCES_PATHS: ${{ github.workspace }}/desktop/qml
          EXTRA_QT_MODULES: svg # icons are SVG, but nothing links Qt Svg directly
        run: |
          for tool in linuxdeploy linuxdeploy-plugin-qt; do
            curl -fsSLO "https://github.com/linuxdeploy/$tool/releases/download/continuous/$tool-x86_64.AppImage"
          done
          chmod +x linuxdeploy*.AppImage
          cp desktop/assets/icon.svg aikatsu.svg
          ./linuxdeploy-x86_64.AppImage --appdir AppDir -e target/release/aikatsu \
            -d desktop/packaging/aikatsu.desktop -i aikatsu.svg --plugin qt --output appimage
          mv Aikatsu*-x86_64.AppImage "Aikatsu-${{ github.ref_name }}-x86_64.AppImage"

      # The same AppDir as the AppImage, so all three ship the same Qt and libraries.
      - name: .deb and .tar.gz
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "aikatsu") | .version')
          desktop/packaging/deb.sh AppDir "$version" "Aikatsu-${{ github.ref_name }}-linux-amd64.deb"
          mv AppDir aikatsu
          tar -czf "Aikatsu-${{ github.ref_name }}-linux-x86_64.tar.gz" aikatsu

      # Only what the .deb depends on is installed, so a missing dependency fails here instead of on users' machines.
      - name: Start the .deb on a clean system
        run: |
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -euc '
            apt-get update -qq
            apt-get install -y -qq ./Aikatsu-*.deb xvfb xauth >/dev/null
            timeout 120 xvfb-run -a aikatsu --screenshot /w/started.png --delay 3000
            test -s /w/started.png'

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            Aikatsu-*.AppImage
            Aikatsu-*.deb
            Aikatsu-*.tar.gz
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtimageformats
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1
      - uses: ilammy/setup-nasm@v1 # BoringSSL
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: libmpv
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo shinchiro/mpv-winbuild-cmake --pattern "mpv-dev-x86_64-20*.7z" --dir mpv
          7z x (Get-ChildItem mpv\*.7z)[0].FullName -ompv-dev | Out-Null
          Set-Location mpv-dev
          # The archive has no MSVC import library, so build one from the DLL's exports.
          $exports = dumpbin /exports libmpv-2.dll |
            Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]{8}\s+(\w+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value }
          Set-Content mpv.def (@("EXPORTS") + $exports)
          lib /nologo /def:mpv.def /name:libmpv-2.dll /out:mpv.lib /machine:x64
          "MPV_DIR=$PWD" | Out-File $env:GITHUB_ENV -Append

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Icon font
        run: |
          pip install fonttools brotli
          python desktop/assets/fonts/subset_icons.py

      - name: Build
        run: cargo build --release --locked
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}\bin\qmake.exe

      - name: Package
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target\release\aikatsu.exe, "$env:MPV_DIR\libmpv-2.dll" dist
          windeployqt --release --compiler-runtime --qmldir desktop\qml dist\aikatsu.exe
          # Icons are SVG, but nothing links Qt Svg directly, so windeployqt skips it.
          New-Item -ItemType Directory -Force dist\imageformats | Out-Null
          Copy-Item "$env:QT_ROOT_DIR\bin\Qt6Svg.dll" dist
          Copy-Item "$env:QT_ROOT_DIR\plugins\imageformats\qsvg.dll" dist\imageformats
          Copy-Item "$env:QT_ROOT_DIR\plugins\imageformats\qwebp.dll" dist\imageformats
          Compress-Archive dist\* "Aikatsu-${{ github.ref_name }}-windows-x64.zip"

      - name: Installer
        run: |
          choco install nsis -y --no-progress # windows-2025 runners no longer ship it
          # Last, so its exit code fails the step.
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /V2 "/DVERSION=$('${{ github.ref_name }}'.TrimStart('v'))" "/DDIST=$PWD\dist" `
            "/DOUTFILE=$PWD\Aikatsu-${{ github.ref_name }}-windows-x64-setup.exe" desktop\packaging\aikatsu.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            Aikatsu-*.zip
            Aikatsu-*-setup.exe
          if-no-files-found: error

  macos:
    # Apple Silicon. Homebrew's libraries target this runner's macOS, hence LSMinimumSystemVersion in Info.plist.
    runs-on: macos-14
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      - name: Homebrew packages
        run: brew install mpv dylibbundler pkgconf

      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          arch: clang_64
          modules: qtimageformats
          aqtsource: ${{ env.AQT_SOURCE }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Icon font
        run: |
          pip install fonttools brotli
          python desktop/assets/fonts/subset_icons.py

      - name: Build
        run: cargo build --release --locked
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake

      - name: App bundle
        run: |
          app=Aikatsu.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$app/Contents/Frameworks" "$app/Contents/PlugIns/imageformats"
          cp target/release/aikatsu "$app/Contents/MacOS/"
          cp desktop/assets/icon.icns "$app/Contents/Resources/aikatsu.icns"
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "aikatsu") | .version')
          sed "s/@VERSION@/$version/g" desktop/packaging/Info.plist > "$app/Contents/Info.plist"

          # macdeployqt only brings Qt: libmpv and the Homebrew libraries under it go in first.
          linked=$(otool -L "$app/Contents/MacOS/aikatsu" | awk '/libmpv/ { print $1 }')
          mpv=$(basename "$linked")
          cp "$linked" "$app/Contents/Frameworks/"
          chmod u+w "$app/Contents/Frameworks/$mpv"
          install_name_tool -change "$linked" "@executable_path/../Frameworks/$mpv" "$app/Contents/MacOS/aikatsu"
          install_name_tool -id "@executable_path/../Frameworks/$mpv" "$app/Contents/Frameworks/$mpv"
          dylibbundler -of -b -x "$app/Contents/Frameworks/$mpv" -d "$app/Contents/Frameworks" \
            -p @executable_path/../Frameworks/ -s "$(brew --prefix)/lib" < /dev/null

          # Icons are SVG, but nothing links Qt Svg directly, so macdeployqt skips its plugin.
          cp "$QT_ROOT_DIR/plugins/imageformats/libqsvg.dylib" "$app/Contents/PlugIns/imageformats/"
          macdeployqt "$app" -qmldir=desktop/qml -executable="$app/Contents/PlugIns/imageformats/libqsvg.dylib"
          codesign --force --deep --sign - "$app"

          # Those paths don't exist on other Macs.
          if find "$app" -type f \( -perm -u+x -o -name '*.dylib' \) -exec otool -L {} + | grep -e "$(brew --prefix)" -e "$QT_ROOT_DIR"; then
            echo "::error::the app still loads libraries from outside its bundle"
            exit 1
          fi

      - name: Disk image
        run: |
          mkdir dmg
          mv Aikatsu.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes reports the volume busy on CI runners; a retry gets past it.
          for try in 1 2 3; do
            hdiutil create -volname Aikatsu -srcfolder dmg -fs HFS+ -format UDZO "Aikatsu-${{ github.ref_name }}-macos-arm64.dmg" && break
            [ "$try" = 3 ] && exit 1
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: Aikatsu-*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # cargokit builds the Rust side through rustup, once per ABI (NDK and cmake come with the runner).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            # Test builds may use the debug key; a release can't, or it won't update installed copies.
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::ANDROID_KEYSTORE_B64 is not set"; exit 1; fi
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > mobile/android/app/upload.jks
          printf 'storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$PASSWORD" "$ALIAS" "$PASSWORD" > mobile/android/key.properties

      - name: Build
        working-directory: mobile
        run: |
          # versionCode must grow with every release so installs update in place
          # (--split-per-abi adds 1000 × the ABI on top, so each APK updates its own kind).
          args=(--build-number "${{ github.run_number }}")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then args+=(--build-name "${GITHUB_REF_NAME#v}"); fi
          # One APK per ABI, each with only its own native libs (Rust core, libmpv, Flutter).
          # Dart symbols are obfuscated; the names live in build/debug-info, kept below.
          flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info "${args[@]}"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            mv "build/app/outputs/flutter-apk/app-$abi-release.apk" "../Aikatsu-${{ github.ref_name }}-android-$abi.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: Aikatsu-*.apk
          if-no-files-found: error

      # Needed to read crash stack traces from these builds (`flutter symbolize`).
      # A workflow artifact, not a release asset: publishing it would undo the obfuscation.
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-android
          path: mobile/build/debug-info
          if-no-files-found: error
          retention-days: 90

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-* # not symbols-android
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # The in-app updater (core/src/update.rs) finds its file by the end of these names.
          files: dist/*
          generate_release_notes: true
          body: |
            **Which file?**
            - Windows: `…-windows-x64-setup.exe` to install, or `…-windows-x64.zip` to run without installing.
            - macOS (Apple Silicon, macOS 14+): `…-macos-arm64.dmg`. The first time, open it from System Settings › Privacy & Security › Open Anyway.
            - Linux: `…-x86_64.AppImage`, which updates itself; `…-linux-amd64.deb` for Debian and Ubuntu; or `…-linux-x86_64.tar.gz`, run `aikatsu/AppRun`.
            - Android: `…-android-arm64-v8a.apk` for almost every phone; `…-armeabi-v7a.apk` for older 32-bit phones; `…-x86_64.apk` for emulators and Chromebooks.
          prerelease: ${{ contains(github.ref_name, '-') }} # e.g. v0.2.0-beta.1
